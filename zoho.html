<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermia — Connect Zoho CRM</title>
<style>
:root { --black: #000; --cream: #FAF8F4; --gold: #C9A961; }
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--cream);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.card {
  background: white;
  max-width: 480px;
  width: 100%;
  padding: 48px 40px;
  border-radius: 16px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.08);
  text-align: center;
}
h1 { font-size: 28px; margin-bottom: 40px; }
.btn {
  width: 100%;
  padding: 18px;
  background: #000;
  color: white;
  font-size: 16px;
  font-weight: 600;
  border: none;
  border-radius: 12px;
  cursor: pointer;
}
</style>
</head>
<body>
<div class="card">
  <h1>Connect Zoho CRM</h1>
  <button class="btn" onclick="startZohoOAuth()">Connect Zoho CRM →</button>
</div>

<script>
function startZohoOAuth() {
  const CLIENT_ID = '1000.0W6DBC9UGVR2OSKNQEOZSDNDXVLZ1B';
  const REDIRECT_URI = 'https://capital-dot.github.io/hermia-connect/zoho-callback.html';
  const SCOPES = 'ZohoCRM.modules.contacts.CREATE,ZohoCRM.modules.contacts.UPDATE,ZohoCRM.modules.leads.CREATE,ZohoCRM.modules.deals.CREATE,ZohoCRM.settings.fields.CREATE';

  const authUrl = `https://accounts.zoho.com.au/oauth/v2/auth?response_type=code&client_id=${CLIENT_ID}&scope=${encodeURIComponent(SCOPES)}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&access_type=offline`;
  
  window.location.href = authUrl;
}
</script>
</body>
</html>
