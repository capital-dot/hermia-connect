<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hermia | Complete Your Enquiry</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #0a0a0a;
      color: #f5f5f5;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    .logo-wrap {
      text-align: center;
      margin-bottom: 36px;
    }

    .logo-wrap img {
      height: 52px;
      object-fit: contain;
    }

    .card {
      background: #111111;
      border: 1px solid #c9a84c;
      border-radius: 16px;
      padding: 44px 40px;
      box-shadow: 0 0 60px rgba(201, 168, 76, 0.08);
    }

    .card h1 {
      font-family: 'Playfair Display', serif;
      font-size: 26px;
      color: #c9a84c;
      margin-bottom: 10px;
      line-height: 1.3;
    }

    .card p {
      font-size: 14px;
      color: #888;
      margin-bottom: 32px;
      line-height: 1.6;
    }

    .enquiry-box {
      background: #1a1a1a;
      border-left: 3px solid #c9a84c;
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 28px;
      font-size: 13px;
      color: #aaa;
      line-height: 1.6;
      font-style: italic;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #c9a84c;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 14px 16px;
      color: #f5f5f5;
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      margin-bottom: 20px;
      transition: border-color 0.2s;
      outline: none;
    }

    input:focus {
      border-color: #c9a84c;
    }

    input::placeholder {
      color: #444;
    }

    button {
      width: 100%;
      background: linear-gradient(135deg, #c9a84c, #e8c96a);
      color: #0a0a0a;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 15px;
      padding: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      letter-spacing: 0.04em;
      transition: opacity 0.2s;
      margin-top: 8px;
    }

    button:hover { opacity: 0.9; }

    .footer {
      text-align: center;
      margin-top: 28px;
      font-size: 12px;
      color: #444;
    }

    .success {
      display: none;
      text-align: center;
      padding: 40px 20px;
    }

    .success h2 {
      font-family: 'Playfair Display', serif;
      color: #c9a84c;
      font-size: 24px;
      margin-bottom: 12px;
    }

    .success p {
      color: #888;
      font-size: 14px;
    }

    .checkmark {
      font-size: 48px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="logo-wrap">
      <img src="https://raw.githubusercontent.com/capital-dot/hermia-connect/main/logo.png" alt="Hermia" />
    </div>

    <div class="card" id="formCard">
      <h1>Complete Your Enquiry</h1>
      <p>We work with your agent and received your message. To connect you with the right person, please confirm your details below.</p>

      <div class="enquiry-box" id="enquiryBox">
        Loading your enquiry...
      </div>

      <div id="formFields">
        <label>Full Name</label>
        <input type="text" id="name" placeholder="e.g. Justin Website" />

        <label>Phone Number</label>
        <input type="tel" id="phone" placeholder="e.g. 0412 345 678" />

        <label>Email Address</label>
        <input type="email" id="email" placeholder="e.g. justin@email.com" />

        <button onclick="submitForm()">Confirm My Details →</button>
      </div>

      <div class="success" id="successMsg">
        <div class="checkmark">✓</div>
        <h2>You're all set!</h2>
        <p>Your agent will be in touch with you shortly.</p>
      </div>
    </div>

    <div class="footer">
      Powered by Hermia · Real Estate Intelligence
    </div>

  </div>

  <script>
    // Pull enquiry text from URL param
    const params = new URLSearchParams(window.location.search);
    const enquiry = params.get('enquiry');
    const nameParam = params.get('name');
    const webhookUrl = params.get('webhook');

    if (enquiry) {
      document.getElementById('enquiryBox').textContent = decodeURIComponent(enquiry);
    } else {
      document.getElementById('enquiryBox').textContent = 'Your property enquiry has been received.';
    }

    if (nameParam) {
      document.getElementById('name').value = decodeURIComponent(nameParam);
    }

    async function submitForm() {
      const name = document.getElementById('name').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const email = document.getElementById('email').value.trim();

      if (!name || !phone || !email) {
        alert('Please fill in all fields.');
        return;
      }

      if (webhookUrl) {
        await fetch(decodeURIComponent(webhookUrl), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, phone, email })
        });
      }

      document.getElementById('formFields').style.display = 'none';
      document.getElementById('enquiryBox').style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
    }
  </script>
</body>
</html>
