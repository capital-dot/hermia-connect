<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermia — Finalizing...</title>
<style>
:root {
  --black: #000000; --white: #FFFFFF; --cream: #FAF8F4;
  --gold: #C9A961; --gray: #6B6B6B; --light-gray: #E5E5E5;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, sans-serif;
  background: var(--cream); min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 20px; animation: fadeIn 0.6s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.card {
  background: var(--white); max-width: 480px; width: 100%;
  padding: 48px 40px; border-radius: 16px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.06); text-align: center;
}
.logo { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 40px; }
.logo-icon {
  width: 48px; height: 48px; background: var(--cream);
  border: 2px solid var(--gold); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
}
.logo-icon svg { width: 24px; height: 24px; }
.logo-text { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
.progress { display: flex; gap: 8px; margin-bottom: 12px; }
.progress-dot { flex: 1; height: 4px; background: var(--light-gray); border-radius: 2px; }
.progress-dot.active { background: var(--black); }
.step-label { font-size: 13px; color: var(--gray); margin-bottom: 24px; font-weight: 500; }
h1 { font-size: 28px; font-weight: 700; margin-bottom: 16px; letter-spacing: -0.5px; }
.checkmark { font-size: 48px; margin-bottom: 16px; }
.subtitle { font-size: 16px; color: var(--gray); line-height: 1.5; margin-bottom: 32px; }
.spinner {
  border: 3px solid var(--light-gray);
  border-top: 3px solid var(--black);
  border-radius: 50%; width: 32px; height: 32px;
  animation: spin 1s linear infinite; margin: 0 auto;
}
@keyframes spin { to { transform: rotate(360deg); } }
.error { color: #C92929; font-size: 14px; margin-top: 16px; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12L12 3l9 9"/>
        <path d="M5 10v10h14V10"/>
        <path d="M9 20v-6h6v6"/>
      </svg>
    </div>
    <div class="logo-text">Hermia</div>
  </div>

  <div class="progress">
    <div class="progress-dot active"></div>
    <div class="progress-dot active"></div>
    <div class="progress-dot active"></div>
  </div>
  <div class="step-label">Step 3 of 3</div>

  <div class="checkmark">✅</div>
  <h1>Airtable Connected</h1>
  <p class="subtitle">Redirecting to payment...</p>
  <div class="spinner"></div>
  <div id="error" class="error" style="display:none;"></div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const code = params.get('code');
const email = params.get('state');
const verifier = sessionStorage.getItem('airtable_verifier');
const errorBox = document.getElementById('error');

if (!code || !email || !verifier) {
  errorBox.textContent = 'Connection error. Please contact capital@hermia.au';
  errorBox.style.display = 'block';
} else {
  fetch('https://hook.eu1.make.com/txewew1xu6nbctosap1v2kxorz88xbq2', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      type: 'airtable',
      code: code,
      email: email,
      code_verifier: verifier
    })
  })
  .then(() => {
    setTimeout(() => {
      window.location.href = `https://hermia.au/done.html`;
    }, 2000);
  })
  .catch(() => {
    errorBox.textContent = 'Connection error. Please contact capital@hermia.au';
    errorBox.style.display = 'block';
  });
}
</script>
</body>
</html>
