<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermia — Connect Airtable</title>
<style>
:root {
  --black: #000000;
  --white: #FFFFFF;
  --cream: #FAF8F4;
  --gold: #C9A961;
  --gray: #6B6B6B;
  --light-gray: #E5E5E5;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, sans-serif;
  background: var(--cream);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  animation: fadeIn 0.6s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.card {
  background: var(--white);
  max-width: 480px;
  width: 100%;
  padding: 48px 40px;
  border-radius: 16px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.06);
  text-align: center;
}
.logo { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 40px; }
.logo-icon {
  width: 48px; height: 48px;
  background: var(--cream);
  border: 2px solid var(--gold);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
}
.logo-icon svg { width: 24px; height: 24px; }
.logo-text { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
.progress { display: flex; gap: 8px; margin-bottom: 12px; }
.progress-dot { flex: 1; height: 4px; background: var(--light-gray); border-radius: 2px; }
.progress-dot.active { background: var(--black); }
.step-label { font-size: 13px; color: var(--gray); margin-bottom: 24px; font-weight: 500; }
h1 { font-size: 28px; font-weight: 700; margin-bottom: 12px; letter-spacing: -0.5px; }
.subtitle { font-size: 16px; color: var(--gray); line-height: 1.5; margin-bottom: 32px; }
.btn {
  background: var(--black);
  color: var(--white);
  border: none;
  padding: 16px 32px;
  font-size: 16px;
  font-weight: 600;
  border-radius: 10px;
  cursor: pointer;
  width: 100%;
  transition: transform 0.2s, opacity 0.2s;
  font-family: inherit;
}
.btn:hover { transform: translateY(-1px); opacity: 0.9; }
.security { margin-top: 24px; font-size: 12px; color: var(--gray); }
.error { color: #C92929; font-size: 14px; margin-top: 16px; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12L12 3l9 9"/>
        <path d="M5 10v10h14V10"/>
        <path d="M9 20v-6h6v6"/>
      </svg>
    </div>
    <div class="logo-text">Hermia</div>
  </div>

  <div class="progress">
    <div class="progress-dot active"></div>
    <div class="progress-dot active"></div>
    <div class="progress-dot"></div>
  </div>
  <div class="step-label">Step 2 of 3 — Connect your database</div>

  <h1>Connect your Airtable</h1>
  <p class="subtitle">Hermia will automatically build your lead database — tables, fields, and pipelines all set up instantly.</p>

  <button id="connectBtn" class="btn">Connect Airtable →</button>
  <div id="error" class="error" style="display:none;"></div>

  <p class="security">🔒 Secure OAuth connection · We never delete your data</p>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const email = params.get('email');
const errorBox = document.getElementById('error');
const btn = document.getElementById('connectBtn');

function generateCodeVerifier() {
  const array = new Uint8Array(32);
  crypto.getRandomValues(array);
  return btoa(String.fromCharCode(...array)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
}

async function generateCodeChallenge(verifier) {
  const encoder = new TextEncoder();
  const data = encoder.encode(verifier);
  const digest = await crypto.subtle.digest('SHA-256', data);
  return btoa(String.fromCharCode(...new Uint8Array(digest))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
}

if (!email) {
  btn.addEventListener('click', async () => {
    const verifier = generateCodeVerifier();
    const challenge = await generateCodeChallenge(verifier);
    sessionStorage.setItem('airtable_verifier', verifier);

    const clientId = 'edf080d2-286b-4bd5-8cb8-dbc569bb08ee';
    const redirectUri = encodeURIComponent('https://hermia.au/airtable-callback.html');
    const scopes = encodeURIComponent('data.records:read data.records:write schema.bases:read schema.bases:write workspacesAndBases:read');
    const state = encodeURIComponent(email || '');

    window.location.href = `https://airtable.com/oauth2/v1/authorize?client_id=${clientId}&redirect_uri=${redirectUri}&response_type=code&scope=${scopes}&state=${state}&code_challenge=${challenge}&code_challenge_method=S256`;
  });
} else {
  btn.addEventListener('click', async () => {
    const verifier = generateCodeVerifier();
    const challenge = await generateCodeChallenge(verifier);
    localStorage.setItem('airtable_verifier', verifier);

    const clientId = 'edf080d2-286b-4bd5-8cb8-dbc569bb08ee';
    const redirectUri = encodeURIComponent('https://hermia.au/airtable-callback.html');
    const scopes = encodeURIComponent('data.records:read data.records:write schema.bases:read schema.bases:write workspacesAndBases:read');
    const state = encodeURIComponent(email);

    window.location.href = `https://airtable.com/oauth2/v1/authorize?client_id=${clientId}&redirect_uri=${redirectUri}&response_type=code&scope=${scopes}&state=${state}&code_challenge=${challenge}&code_challenge_method=S256`;
  });
}
</script>
</body>
</html>
