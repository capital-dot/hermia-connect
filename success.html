<!DOCTYPE html>
<html>
<head>
  <title>Hermia - Connected!</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: white;
    }
    .logo {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 4px;
      margin-bottom: 40px;
      color: #f5c842;
    }
    .card {
      background: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 20px;
      padding: 50px 40px;
      text-align: center;
      max-width: 420px;
      width: 90%;
    }
    .check-circle {
      width: 80px;
      height: 80px;
      background: #1a3a2a;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }
    .check-circle svg {
      width: 40px;
      height: 40px;
      stroke: #4ade80;
    }
    .connected-badge {
      background: #1a3a2a;
      color: #4ade80;
      border: 1px solid #4ade80;
      border-radius: 20px;
      padding: 6px 18px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      display: inline-block;
      margin-bottom: 20px;
    }
    h2 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #f5c842;
    }
    p {
      color: #888;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 8px;
    }
    .footer {
      margin-top: 40px;
      color: #444;
      font-size: 13px;
    }
    .footer a { color: #f5c842; text-decoration: none; }
  </style>
</head>
<body>
  <div class="logo">⚡ HERMIA</div>
  <div class="card">
    <div class="connected-badge">CONNECTED</div>
    <div class="check-circle">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/>
      </svg>
    </div>
    <h2>HubSpot Connected!</h2>
    <p>Your HubSpot is now connected to<br><strong style="color:white">Hermia Lead Accelerator V8</strong></p>
    <p style="margin-top:16px">Your workflow will be fully active within <strong style="color:white">24 hours</strong>. Watch for leads coming into your HubSpot automatically.</p>
    <p style="margin-top:20px">Questions? <a href="mailto:capital@hermia.au" style="color:#f5c842">capital@hermia.au</a></p>
  </div>
  <div class="footer">Hermia Lead Accelerator V8 &nbsp;·&nbsp; <a href="mailto:capital@hermia.au">capital@hermia.au</a></div>
</body>
</html>
