<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You | Hermia</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Syne:wght@600;700&display=swap');

    body {
      margin: 0;
      padding: 0;
      background: #0a0a0b;
      color: #f5f1e8;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
    }

    .container {
      max-width: 620px;
      padding: 40px 24px;
    }

    .logo {
      width: 110px;
      height: 110px;
      margin: 0 auto 40px;
      display: block;
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 42px;
      font-weight: 700;
      letter-spacing: -1px;
      margin-bottom: 16px;
      color: #f5f1e8;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
      color: #b8b5ad;
      max-width: 460px;
      margin: 0 auto 40px;
    }

    .message {
      background: rgba(245, 241, 232, 0.04);
      border: 1px solid rgba(245, 241, 232, 0.12);
      border-radius: 12px;
      padding: 32px 40px;
      margin-bottom: 40px;
    }

    .gold {
      color: #c9a35b;
    }

    .footer {
      font-size: 13px;
      color: #8b8a84;
      margin-top: 60px;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="https://yourdomain.com/logo.png" alt="Hermia" class="logo"> <!-- Replace with your actual logo URL or upload to Tally -->

    <h1>Thank you!</h1>

    <div class="message">
      <p>Your application has been received.</p>
      <p>Our team will review your details and get back to you within <span class="gold">24 hours</span> with next steps and access to the full onboarding.</p>
    </div>

    <p style="font-size:15px; color:#8b8a84;">
      You’ll hear from us very soon.<br>
      — The Hermia Team
    </p>

    <div class="footer">
      Hermia • ABN 75 434 177 026 • Victoria, Australia
    </div>
  </div>
</body>
</html>
