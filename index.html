<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermia — Connect Zoho CRM</title>
<style>
:root {
  --black: #000000; --white: #FFFFFF; --cream: #FAF8F4;
  --gold: #C9A961; --gray: #6B6B6B; --light-gray: #E5E5E5;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, sans-serif;
  background: var(--cream); min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 20px; animation: fadeIn 0.6s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.card {
  background: var(--white); max-width: 480px; width: 100%;
  padding: 48px 40px; border-radius: 16px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.06); text-align: center;
}
.logo { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 40px; }
.logo-icon {
  width: 48px; height: 48px; background: var(--cream);
  border: 2px solid var(--gold); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
}
.logo-icon svg { width: 24px; height: 24px; }
.logo-text { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
.progress { display: flex; gap: 8px; margin-bottom: 12px; }
.progress-dot { flex: 1; height: 4px; background: var(--light-gray); border-radius: 2px; }
.progress-dot.active { background: var(--black); }
.step-label { font-size: 13px; color: var(--gray); margin-bottom: 40px; font-weight: 500; }
h1 { font-size: 28px; font-weight: 700; margin-bottom: 40px; letter-spacing: -0.5px; }
.btn {
  width: 100%; padding: 16px;
  background: var(--black); color: var(--white);
  border: none; border-radius: 12px;
  font-size: 15px; font-weight: 600;
  cursor: pointer; font-family: inherit;
  margin-bottom: 16px; transition: all 0.2s ease;
}
.btn:hover { background: #1a1a1a; transform: translateY(-1px); }
.security { font-size: 12px; color: var(--gray); }
.spinner-inline {
  width: 16px; height: 16px; display: inline-block;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: white; border-radius: 50%;
  animation: spin 0.8s linear infinite; vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12L12 3l9 9"/>
        <path d="M5 10v10h14V10"/>
        <path d="M9 20v-6h6v6"/>
      </svg>
    </div>
    <div class="logo-text">Hermia</div>
  </div>

  <div class="progress">
    <div class="progress-dot active"></div>
    <div class="progress-dot"></div>
    <div class="progress-dot"></div>
  </div>
  <div class="step-label">Step 1 of 3 — Connect your CRM</div>

  <h1>Connect Zoho CRM</h1>

  <button class="btn" id="connectBtn" onclick="startZohoOAuth()">
    Connect Zoho CRM →
  </button>

  <div class="security">🔐 Encrypted · Never shared with third parties</div>
</div>

<script>
function startZohoOAuth() {
  const btn = document.getElementById('connectBtn');
  btn.innerHTML = '<span class="spinner-inline"></span> Connecting...';
  btn.style.pointerEvents = 'none';

  const params = new URLSearchParams(window.location.search);
  const email = params.get('email') || '';

  const CLIENT_ID = '1000.0W6DBC9UGVR2OSKNQEOZSDNDXVLZ1B';
  const REDIRECT_URI = 'https://hermia.au/zoho-callback.html';
  const SCOPES = 'ZohoCRM.modules.contacts.CREATE,ZohoCRM.modules.contacts.UPDATE,ZohoCRM.modules.leads.CREATE,ZohoCRM.modules.deals.CREATE,ZohoCRM.settings.fields.CREATE';

  const authUrl = `https://accounts.zoho.com.au/oauth/v2/auth?response_type=code&client_id=${CLIENT_ID}&scope=${encodeURIComponent(SCOPES)}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&access_type=offline&state=${encodeURIComponent(email)}`;

  setTimeout(() => { window.location.href = authUrl; }, 600);
}
</script>
</body>
</html>
