<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermia — Setup Complete</title>
<style>
:root {
  --black: #000000; --white: #FFFFFF; --cream: #FAF8F4;
  --gold: #C9A961; --gray: #6B6B6B; --light-gray: #E5E5E5;
  --green: #10B981;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, sans-serif;
  background: var(--cream); min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 20px; animation: fadeIn 0.6s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.card {
  background: var(--white); max-width: 480px; width: 100%;
  padding: 48px 40px; border-radius: 16px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.06); text-align: center;
}
.logo { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 40px; }
.logo-icon {
  width: 48px; height: 48px; background: var(--cream);
  border: 2px solid var(--gold); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
}
.logo-icon svg { width: 24px; height: 24px; }
.logo-text { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
.progress { display: flex; gap: 8px; margin-bottom: 12px; }
.progress-dot { flex: 1; height: 4px; background: var(--black); border-radius: 2px; }
.step-label { font-size: 13px; color: var(--gray); margin-bottom: 24px; font-weight: 500; }
h1 { font-size: 32px; font-weight: 700; margin-bottom: 16px; letter-spacing: -0.5px; }
.success-icon {
  font-size: 64px;
  margin-bottom: 24px;
  animation: pop 0.5s ease;
}
@keyframes pop { 0% { transform: scale(0); } 60% { transform: scale(1.2); } 100% { transform: scale(1); } }
.subtitle { font-size: 16px; color: var(--gray); line-height: 1.6; margin-bottom: 32px; }
.info-card {
  background: var(--cream); border-radius: 12px; padding: 24px;
  margin-bottom: 24px; text-align: left;
}
.info-row { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
.info-row:not(:last-child) { border-bottom: 1px solid var(--light-gray); }
.info-icon { font-size: 20px; }
.info-text { font-size: 14px; color: var(--black); font-weight: 500; }
.footer-text { font-size: 13px; color: var(--gray); margin-top: 24px; }
.footer-text a { color: var(--black); text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12L12 3l9 9"/>
        <path d="M5 10v10h14V10"/>
        <path d="M9 20v-6h6v6"/>
      </svg>
    </div>
    <div class="logo-text">Hermia</div>
  </div>

  <div class="progress">
    <div class="progress-dot"></div>
    <div class="progress-dot"></div>
    <div class="progress-dot"></div>
  </div>
  <div class="step-label">Setup Complete</div>

  <div class="success-icon">✅</div>
  <h1>You're all set!</h1>
  <p class="subtitle">Zoho CRM and Airtable are connected. Hermia is configuring your AI lead qualification system now.</p>

  <div class="info-card">
    <div class="info-row">
      <div class="info-icon">⏱</div>
      <div class="info-text">Live within 24 hours</div>
    </div>
    <div class="info-row">
      <div class="info-icon">📧</div>
      <div class="info-text">Confirmation email when activated</div>
    </div>
    <div class="info-row">
      <div class="info-icon">💬</div>
      <div class="info-text">Questions? capital@hermia.au</div>
    </div>
  </div>

  <p class="footer-text">Hermia AI · <a href="https://hermia.au">hermia.au</a></p>
</div>
</body>
</html>
