<!DOCTYPE html>
<html>
<head>
  <title>Hermia - Connecting...</title>
</head>
<body>
<script>
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');

  if (code) {
    fetch('https://hook.eu1.make.com/kmdclyt3r0jg5tbhgtc67piy9gognf', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: code })
    })
    .then(() => {
      window.location.href = 'https://hermia.au?connected=true';
    })
    .catch(() => {
      window.location.href = 'https://hermia.au?error=true';
    });
  }
</script>
</body>
</html>
