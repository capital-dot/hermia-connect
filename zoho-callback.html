<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connected Successfully</title>
<style>
  body {
    background: #080808;
    color: #f5f1e8;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    text-align: center;
  }
  .card {
    max-width: 460px;
    padding: 40px 30px;
  }
  .logo {
    width: 100px;
    height: 100px;
    margin: 0 auto 24px;
    display: block;
  }
  h1 {
    font-size: 26px;
    margin-bottom: 12px;
    color: #C9A35B;
  }
  p {
    color: #b8b5ad;
    font-size: 16px;
    line-height: 1.6;
  }
  .success {
    font-size: 48px;
    margin-bottom: 20px;
  }
</style>
</head>
<body>
  <div class="card">
    <img src="https://raw.githubusercontent.com/capital-dot/hermia-connect/main/logo.png" alt="Hermia" class="logo">
    
    <div class="success">✅</div>
    <h1>Connected Successfully!</h1>
    <p>Your Zoho CRM is now connected to Hermia.</p>
    <p>Qualified leads will start flowing into your pipeline automatically.</p>
    
    <p style="margin-top:40px; font-size:14px; color:#888;">
      You can close this tab and return to your email.
    </p>
  </div>

  <script>
    // Send the code to Make.com in the background
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');

    if (code) {
      fetch('https://hook.eu1.make.com/txewew1xu6nbctosap1v2kxorz88xbq2', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ type: 'zoho', code: code })
      }).catch(() => {}); // silent fail - we already show success
    }

    // Auto-redirect back to marketing page after 6 seconds
    setTimeout(() => {
      window.location.href = 'https://capital-dot.github.io/hermia-connect/marketing.html';
    }, 6000);
  </script>
</body>
</html>
