<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connecting...</title>
</head>
<body>
<script>
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  
  if (code) {
    // Send the code to your Make.com webhook
    fetch('https://hook.eu1.make.com/txewew1xu6nbctosap1v2kxorz88xbq2', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type: 'zoho', code: code })
    })
    .then(() => window.location.href = 'https://capital-dot.github.io/hermia-connect/marketing.html') // or done.html
    .catch(() => window.location.href = 'https://capital-dot.github.io/hermia-connect/marketing.html');
  } else {
    window.location.href = 'https://capital-dot.github.io/hermia-connect/marketing.html';
  }
</script>
</body>
</html>
