<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connecting to Zoho...</title>
<style>
  body {
    background: #080808;
    color: #f5f1e8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    text-align: center;
  }
  .card {
    max-width: 420px;
    padding: 40px 30px;
  }
  .logo {
    width: 90px;
    height: 90px;
    margin: 0 auto 30px;
    display: block;
  }
  h1 {
    font-size: 24px;
    margin-bottom: 16px;
  }
  p {
    color: #b8b5ad;
    font-size: 16px;
    line-height: 1.5;
  }
  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid rgba(201,163,91,0.2);
    border-top-color: #c9a35b;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 30px auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="card">
    <img src="https://raw.githubusercontent.com/capital-dot/hermia-connect/main/logo.png" alt="Hermia" class="logo">
    
    <h1>Connecting to Zoho CRM...</h1>
    <div class="spinner"></div>
    <p>Please wait while we finish setting up your connection.</p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');

    if (code) {
      // Send the authorization code to your Make.com webhook
      fetch('https://hook.eu1.make.com/txewew1xu6nbctosap1v2kxorz88xbq2', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
          type: 'zoho', 
          code: code 
        })
      })
      .then(() => {
        // Success → go back to your marketing page
        window.location.href = 'https://capital-dot.github.io/hermia-connect/marketing.html';
      })
      .catch(() => {
        // Even if webhook fails, still redirect
        window.location.href = 'https://capital-dot.github.io/hermia-connect/marketing.html';
      });
    } else {
      // No code → just go back
      window.location.href = 'https://capital-dot.github.io/hermia-connect/marketing.html';
    }
  </script>
</body>
</html>
