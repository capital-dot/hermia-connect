<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connected Successfully • Hermia</title>
<style>
:root {
  --black: #080808;
  --cream: #FAF8F4;
  --gold: #C9A35B;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, sans-serif;
  background: var(--black);
  color: var(--cream);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
  text-align: center;
}
.card {
  background: #111;
  max-width: 520px;
  width: 100%;
  padding: 60px 40px;
  border-radius: 20px;
  box-shadow: 0 10px 40px rgba(201,163,91,0.15);
  border: 1px solid rgba(201,163,91,0.2);
}
.logo {
  width: 110px;
  height: 110px;
  margin: 0 auto 32px;
  display: block;
}
h1 {
  font-size: 32px;
  font-weight: 700;
  color: #fff;
  margin-bottom: 16px;
}
.success-text {
  font-size: 18px;
  color: #b8b5ad;
  margin-bottom: 40px;
  line-height: 1.5;
}
.check {
  font-size: 64px;
  margin-bottom: 24px;
}
.instruction {
  font-size: 15px;
  color: #aaa;
  margin-top: 40px;
}
</style>
</head>
<body>

<div class="card">
  <img src="https://raw.githubusercontent.com/capital-dot/hermia-connect/main/logo.png" alt="Hermia" class="logo">
  
  <div class="check">✅</div>
  
  <h1>You're connected</h1>
  <p class="success-text">
    Your Zoho CRM is now connected to Hermia.<br>
    Qualified leads will start flowing into your pipeline automatically.
  </p>

  <div class="instruction">
    You can close this tab and return to your email.
  </div>
</div>

</body>
</html>
