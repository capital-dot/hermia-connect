<!DOCTYPE html>
<html>
<head>
  <title>Hermia - Connecting Zoho...</title>
  <style>
    body { background: #0a0a0f; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .spinner { width: 40px; height: 40px; border: 3px solid #2a2a38; border-top-color: #C9A84C; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');

    if (code) {
      fetch('https://hook.eu1.make.com/txewew1xu6nbctosap1v2kxorz88xbq2', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ type: 'zoho', code: code })
      })
      .then(() => { window.location.href = 'https://hermia.au/done.html'; })
      .catch(() => { window.location.href = 'https://hermia.au/done.html'; });
    } else {
      window.location.href = 'https://hermia.au/done.html';
    }
  </script>
</body>
</html>
